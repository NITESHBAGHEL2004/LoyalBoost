<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoyalBoost — Premium Digital Loyalty Platform</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .landing{ min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding: var(--sp-6); }
  .landing .mark{ width:64px; height:64px; border-radius: var(--r-lg); margin: 0 auto var(--sp-5); background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); display:flex; align-items:center; justify-content:center; font-size:1.8rem; box-shadow: var(--shadow-glow); }
</style>
</head>
<body>
  <div class="landing">
    <div>
      <div class="mark">💎</div>
      <h1>LoyalBoost</h1>
      <p>Redirecting to your dashboard…</p>
      <p><a class="btn btn-primary" href="admin/login.html" style="display:inline-flex; margin-top: var(--sp-3);">Go to Admin Login</a></p>
    </div>
  </div>
  <script type="module">
    import { isAuthed } from './js/core/auth.js';
    window.location.replace(isAuthed() ? 'admin/dashboard.html' : 'admin/login.html');
  </script>
</body>
</html>
